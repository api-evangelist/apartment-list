description: Apartment List is a virtual-first online rental marketplace that helps renters find
  apartments across all 50 U.S. states. Founded in September 2011 by John Kobs and Chris Erickson,
  the platform uses an AI-driven "Perfect Match" recommendation engine to pair renters with listings
  based on budget, location, amenities, and lifestyle preferences, and offers a Partner Portal for
  property managers and landlords to list and manage units. The company runs a consumer-facing search
  experience alongside a B2B property-management side. Apartment List does not currently publish a
  public developer API; this profile captures its public web, brand, and security surface.
